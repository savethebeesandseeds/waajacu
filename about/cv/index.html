<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Curriculum vitae of Santiago Restrepo, hosted by Waajacu.">
    <meta name="theme-color" content="#080a09">
    <title>Santiago Restrepo | Curriculum Vitae</title>
    <link rel="canonical" href="https://waajacu.com/about/cv/">
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="stylesheet" href="../../styles.css?v=20260822a">
    <style>
        html,
        body {
            height: 100%;
        }

        body.cv-page {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            background: var(--black);
        }

        .cv-header {
            background: var(--black);
            color: var(--ivory);
        }

        .cv-header .topbar {
            min-height: 76px;
        }

        .cv-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cv-actions a {
            color: rgba(244, 237, 222, 0.72);
            font-family: var(--mono);
            font-size: 0.72rem;
            text-decoration: none;
        }

        .cv-actions a:hover,
        .cv-actions a:focus-visible {
            color: var(--gold);
        }

        .cv-actions .open-pdf {
            padding: 9px 13px;
            border: 1px solid rgba(207, 157, 70, 0.58);
            color: var(--gold);
        }

        .cv-actions .open-pdf:hover,
        .cv-actions .open-pdf:focus-visible {
            background: var(--gold);
            color: var(--black);
        }

        .cv-document {
            min-height: 0;
            padding: 12px;
            background: #151715;
        }

        .cv-document object {
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }

        .fallback {
            min-height: 100%;
            padding: 48px;
            background: var(--ivory);
            color: var(--ink);
        }

        .fallback a {
            color: var(--oxblood);
            font-weight: 700;
            text-underline-offset: 0.2em;
        }

        @media (max-width: 560px) {
            .cv-header .topbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
                padding: 16px 0;
            }

            .cv-actions {
                width: 100%;
                justify-content: space-between;
            }

            .cv-document {
                padding: 0;
            }
        }
    </style>
</head>
<body class="cv-page">
    <a class="skip-link" href="#cv-document">Skip to CV document</a>
    <header class="cv-header">
        <div class="shell topbar">
            <a class="brand" href="../../" aria-label="Waajacu home">
                <span class="brand-dot" aria-hidden="true"></span>
                <span>Waajacu<sup>TM</sup></span>
            </a>
            <h1 class="visually-hidden">Santiago Restrepo — Curriculum Vitae</h1>
            <nav class="cv-actions" aria-label="Curriculum vitae navigation">
                <a href="../">Back to profile</a>
                <a class="open-pdf" href="../../src/documents/curriculum_Santiago_Restrepo_cz.pdf">Open PDF ↗</a>
            </nav>
        </div>
    </header>

    <main class="cv-document" id="cv-document">
        <object
            data="../../src/documents/curriculum_Santiago_Restrepo_cz.pdf#view=FitH"
            type="application/pdf"
            aria-label="Curriculum vitae of Santiago Restrepo">
            <p class="fallback">
                Your browser cannot display the PDF here.
                <a href="../../src/documents/curriculum_Santiago_Restrepo_cz.pdf">Open Santiago Restrepo's CV directly.</a>
            </p>
        </object>
    </main>
</body>
</html>
