<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Curriculum vitae of Santiago Restrepo">
    <title>Santiago Restrepo - Curriculum Vitae</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
            background: #181818;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1rem;
            color: #f4f4f4;
            background: #111;
            border-bottom: 1px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }

        a {
            color: #f4f4f4;
        }

        header a {
            padding: 0.45rem 0.7rem;
            border: 1px solid #666;
            border-radius: 0.35rem;
            text-decoration: none;
            white-space: nowrap;
        }

        object {
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }

        .fallback {
            padding: 2rem;
            color: #111;
            background: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Santiago Restrepo - Curriculum Vitae</h1>
        <a href="/src/documents/curriculum_Santiago_Restrepo_cz.pdf">Open PDF</a>
    </header>
    <object
        data="/src/documents/curriculum_Santiago_Restrepo_cz.pdf#view=FitH"
        type="application/pdf"
        aria-label="Curriculum vitae of Santiago Restrepo"
    >
        <p class="fallback">
            Your browser cannot display the PDF here.
            <a href="/src/documents/curriculum_Santiago_Restrepo_cz.pdf">Open the CV directly.</a>
        </p>
    </object>
</body>
</html>
